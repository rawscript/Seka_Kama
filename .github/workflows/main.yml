name: Seka Kama CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          DEBUG: "true"
          JWT_SECRET_KEY: "ci-test-secret-key-at-least-32-chars!!"
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-key"
          NVIDIA_API_KEY: "placeholder-nvidia-key"
        run: |
          cd backend
          python -m pytest --cov=. --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No cache: here — package-lock.json is not committed.
          # We manage caching manually below so the step never fails
          # with "Some specified paths were not resolved".

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-app/seka_kama/node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('web-app/seka_kama/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Install dependencies
        run: |
          cd web-app/seka_kama
          npm install --legacy-peer-deps

      - name: Type check
        run: |
          cd web-app/seka_kama
          npx tsc --noEmit || true

      - name: Lint
        run: |
          cd web-app/seka_kama
          npm run lint

      - name: Build
        run: |
          cd web-app/seka_kama
          npm run build
