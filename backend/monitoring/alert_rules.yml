# Alert rules for Seka Kama
groups:
  - name: api_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }}% for the last 5 minutes"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 3
        for: 2m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "High API latency detected"
          description: "95th percentile latency is {{ $value }} seconds"

      - alert: HealthCheckFailed
        expr: up{job="seka-kama-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "API health check failed"
          description: "API instance {{ $labels.instance }} is down"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / machine_memory_bytes > 0.8
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}%"

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%"

      - alert: DatabaseConnectionFailed
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "Database connection failed"
          description: "Database instance {{ $labels.instance }} is unreachable"

      - alert: SlowQueries
        expr: rate(pg_stat_database_xact_commit[5m]) / rate(pg_stat_database_xact_total[5m]) < 0.8
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "Slow database queries detected"
          description: "Query performance degraded to {{ $value }}"

  - name: ml_model_alerts
    rules:
      - alert: ModelPredictionError
        expr: rate(model_predictions_total{status="error"}[5m]) / rate(model_predictions_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
          service: ml-model
        annotations:
          summary: "High model prediction error rate"
          description: "Model error rate is {{ $value }}%"

      - alert: LLMServiceDown
        expr: llm_requests_total == 0
        for: 5m
        labels:
          severity: critical
          service: llm
        annotations:
          summary: "LLM service unavailable"
          description: "No LLM requests processed in the last 5 minutes"