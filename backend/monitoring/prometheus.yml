# Prometheus configuration for Seka Kama
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'seka-kama-api'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'seka-kama-api-production'
      - source_labels: [__address__]
        target_label: environment
        replacement: 'production'

  - job_name: 'seka-kama-db'
    static_configs:
      - targets: ['localhost:5432']
    scrape_interval: 30s
    params:
      module: [postgresql]

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'blackbox-exporter'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://seka-kama.vercel.app
        - https://api.seka-kama.io/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'localhost:9115'