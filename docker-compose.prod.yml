version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sekakama
      POSTGRES_USER: sekakama
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changemeinproduction}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sekakama"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sekakama-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sekakama-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    environment:
      # Database
      DATABASE_URL: postgresql://sekakama:${DB_PASSWORD:-changemeinproduction}@postgres:5432/sekakama
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
      
      # Supabase (for production - Supabase handles auth and some data)
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      
      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # LLM
      LLM_API_URL: ${LLM_API_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: stepfun-ai/step-3.5-flash
      
      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN}
      LOGGING_LEVEL: INFO
      
      # CORS
      ALLOWED_ORIGINS: https://seka-kama.vercel.app,http://localhost:3000
      ALLOW_ALL_ORIGINS: "False"
      
      # Feature Flags
      FEATURE_LIVE_MODE_ENABLED: "true"
      FEATURE_SCENARIO_SIMULATION_ENABLED: "true"
      FEATURE_AI_NARRATIVES_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sekakama-network
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./web-app/seka_kama
      dockerfile: Dockerfile.production
    environment:
      # API Configuration
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
      NEXT_PUBLIC_LANDX_TILE_URL: ${NEXT_PUBLIC_LANDX_TILE_URL}
      
      # Analytics
      NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${NEXT_PUBLIC_GOOGLE_ANALYTICS_ID}
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN}
      
      # Feature Flags
      NEXT_PUBLIC_ENABLE_ONBOARDING: "true"
      NEXT_PUBLIC_ENABLE_SCENARIOS: "true"
      NEXT_PUBLIC_ENABLE_AI_INSIGHTS: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - sekakama-network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./backend/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - sekakama-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-grafanaadmin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - sekakama-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional - for production deployment)
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - sekakama-network
    restart: unless-stopped

  # PostgreSQL Exporter for Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://sekakama:${DB_PASSWORD:-changemeinproduction}@postgres:5432/sekakama?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - sekakama-network
    restart: unless-stopped

  # Redis Exporter for Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword}"
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - sekakama-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  sekakama-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16