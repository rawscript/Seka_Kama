model:
  artifact: "backend/models/sekanet_xgboost_shp.pkl"
  algorithm: "XGBoost"
  target_field: "unknown"
  target_unit: "unknown"
  training_data: "data/training/ (not present in repository)"
  training_period: "unknown"
  spatial_validation: "unknown"
  feature_count: 43
  features_file: "backend/models/feature_names.pkl"
  scaler_file: "backend/models/sekanet_scaler_shp.pkl"
  status: "pending_provenance"
  notes: "Lion density prediction model. Training data provenance, target variable definition, and spatial cross-validation methodology require documentation."

validation_gates:
  - gate: "training_provenance"
    status: "blocking"
    required_for: "model_card_completion"
    description: "Document training data sources, collection methods, and temporal coverage"
  
  - gate: "hwc_risk_calibration"
    status: "blocking"
    required_for: "production_deployment"
    description: "Validate HWC risk score formula against ground truth conflict incidents"
  
  - gate: "source_licenses"
    status: "blocking"
    required_for: "public_deployment"
    description: "Verify all data source licenses permit production use and document attribution requirements"
  
  - gate: "spatial_validation"
    status: "blocking"
    required_for: "scientific_publication"
    description: "Document spatial cross-validation methodology used in model training"
