# docker-compose.yml
version: '3.8'

services:
  # PostgreSQL + PostGIS for spatial data
  postgis:
    image: postgis/postgis:16-3.4
    container_name: sekakama_postgis
    environment:
      POSTGRES_DB: sekakama
      POSTGRES_USER: sekakama_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sekakama_user -d sekakama"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sekakama_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sekakama_backend
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DATABASE_URL: postgresql://sekakama_user:${DB_PASSWORD}@postgis:5432/sekakama
      LLM_API_URL: ${LLM_API_URL:-http://ollama:11434/api/generate}
      LLM_MODEL: ${LLM_MODEL:-llama3}
      DEBUG: ${DEBUG:-false}
    volumes:
      - ./models:/app/models
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sekakama_network
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./seka_kama
      dockerfile: Dockerfile
    container_name: sekakama_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sekakama_network
    restart: unless-stopped

  # Optional: Ollama for local LLM (narrative generation)
  ollama:
    image: ollama/ollama:latest
    container_name: sekakama_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - sekakama_network
    restart: unless-stopped
    # Pull llama3 on startup (uncomment if needed)
    # command: sh -c "ollama pull llama3 && ollama serve"

  # Optional: Nginx for reverse proxy (production)
  nginx:
    image: nginx:alpine
    container_name: sekakama_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - sekakama_network
    profiles:
      - production
    restart: unless-stopped

networks:
  sekakama_network:
    driver: bridge

volumes:
  postgis_data:
  ollama_data: